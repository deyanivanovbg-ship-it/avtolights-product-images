<style>
#al-tabs{display:flex;gap:10px;max-width:640px;margin:16px auto 0;padding:0 16px;font-family:Arial,Helvetica,sans-serif}
#al-tabs a{flex:1;text-align:center;padding:12px 8px;border:2px solid #c9a84c;border-radius:8px;color:#111;font-weight:700;font-size:15px;text-decoration:none;background:#fff}
#al-tabs a.on{background:#c9a84c}
#al-led-note{max-width:640px;margin:12px auto 0;padding:0 16px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#333;text-align:center;display:none}
#al-led-note a{color:#9a7a20;font-weight:700}
</style>
<div id="al-tabs"><a href="/store" data-t="g">Стъкла за фарове</a><a href="/store/category/LED-kruski" data-t="l">LED крушки</a></div>
<p id="al-led-note">LED крушки за фарове: цената е за комплект от 2 броя, 2 години гаранция. Не знаеш какъв цокъл ти трябва? <a href="/krushki">Виж тук</a> или ни пиши в <a href="https://m.me/110858323961528">Messenger</a>.</p>
<script>
(function(){
var led=location.pathname.indexOf('/store/category/LED-kruski')===0;
var t=document.querySelector('#al-tabs a[data-t="'+(led?'l':'g')+'"]');if(t)t.className='on';
if(led)document.getElementById('al-led-note').style.display='block';
function go(){
var tabs=document.getElementById('al-tabs'),note=document.getElementById('al-led-note');
var s=document.getElementById('al-search'),g=document.querySelector('.products-list');
if(led)['al-search','al-info-top','al-info'].forEach(function(id){var e=document.getElementById(id);if(e)e.style.display='none';});
var a=(!led&&s&&s.parentElement)?s:g;
if(a&&a.parentElement&&tabs.nextElementSibling!==a&&note.nextElementSibling!==a){a.parentElement.insertBefore(tabs,a);a.parentElement.insertBefore(note,a);}
}
document.addEventListener('DOMContentLoaded',go);window.addEventListener('load',go);setTimeout(go,800);setTimeout(go,2000);
})();
</script>
