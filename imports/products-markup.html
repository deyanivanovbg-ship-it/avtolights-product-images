  var norm = function (s) { return s.toLowerCase().replace(/[\s\-_.()]+/g, ''); };
  // кирилица -> латиница; при двусмислени букви всички варианти (в = v/w, х = h/x, с = s/c, ц = c/ts)
  var TR = { а: ['a'], б: ['b'], в: ['v', 'w'], г: ['g'], д: ['d'], е: ['e'], ж: ['zh', 'j'], з: ['z'], и: ['i'], й: ['y', 'i'], к: ['k'], л: ['l'],
    м: ['m'], н: ['n'], о: ['o'], п: ['p'], р: ['r'], с: ['s', 'c'], т: ['t'], у: ['u'], ф: ['f'], х: ['h', 'x'], ц: ['c', 'ts'], ч: ['ch'],
    ш: ['sh'], щ: ['sht'], ъ: ['a'], ь: [''], ю: ['yu'], я: ['ya'] };
  var variants = function (w) {
    var out = [''];
    for (var i = 0; i < w.length; i++) {
      var opts = TR[w[i]] || [w[i]], next = [];
      out.forEach(function (o) { opts.forEach(function (c) { next.push(o + c); }); });
      out = next.slice(0, 32);
    }
    if (out.indexOf(w) === -1) out.push(w);
    return out;
  };
  var box = document.getElementById('al-search');
  var grid = document.querySelector('.products-list');
  if (grid && grid.parentElement) grid.parentElement.insertBefore(box, grid);
  var input = box.querySelector('input'), res = box.querySelector('.al-res');
  input.addEventListener('input', function () {
    var q = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean).map(norm);
    if (!q.length) { res.style.display = 'none'; return; }
    // всяка дума от търсенето трябва да е част от една дума в името или в синонимите - иначе "4f" намира "W204 Facelift";
    // думата се пробва и на латиница ("ф10" = f10, "в212" = w212)
    var hits = D.filter(function (d) {
      var words = (d[1] + ' ' + (d[4] || '')).toLowerCase().split(/[\s\/(),]+/).map(norm);
      // еднобуквена дума ("е класа") - само в началото на дума, иначе "е" намира всяко име
      return q.every(function (w) { return variants(w).some(function (v) { return words.some(function (t) { var i = t.indexOf(v); return v.length > 1 ? i !== -1 : i === 0; }); }); });
    }).slice(0, 20);
    res.innerHTML = hits.length ? hits.map(function (d) {
      return '<a href="/store/' + d[0] + '"><img loading="lazy" src="' + IMG + d[3] + '" alt=""><span>' + d[1] + '</span><span class="al-p">от ' + d[2] + ' €</span></a>';

    res.style.display = 'block';
  });
  document.addEventListener('click', function (e) { if (!box.contains(e.target)) res.style.display = 'none'; });
})();

<script>
// Заглавие и описание за Google на магазина и категориите. CB не позволява SEO на системната
// страница (system/products дава "Invalid or reserved URL"), затова се задават оттук.
(function () {
  function meta(attr, key, value) {
    var m = document.querySelector('meta[' + attr + '="' + key + '"]');
    if (!m) { m = document.createElement('meta'); m.setAttribute(attr, key); document.head.appendChild(m); }
    m.setAttribute('content', value);
  }
  function run() {
    var path = decodeURIComponent(location.pathname).replace(/\/$/, '');
    var page = (path.match(/\/page\/(\d+)$/) || [])[1];
    path = path.replace(/\/page\/\d+$/, '');
    var c = path.match(/^\/store\/category\/([^/]+)(?:\/sub\/([^/]+))?$/);
    var what = 'Mercedes, BMW, Audi, VW, Porsche';
    if (c) {
      what = c[1];
      if (c[2]) {
        var link = document.querySelector('a[href="' + location.pathname.replace(/\/page\/\d+\/?$/, '') + '"]');
        what += ' ' + (link && link.textContent.trim() ? link.textContent.trim() : c[2].replace(/-/g, ' '));
      }
    } else if (path !== '/store') return;
    var title = 'Стъкла за фарове ' + what + (page ? ' - страница ' + page : '') + ' | Avtolights';
    var desc = c
      ? 'Нови стъкла (капаци) за фарове ' + what + ': ляво, дясно или комплект. Наложен платеж, доставка с Еконт и Спиди. Помощ за избора във Viber.'
      : 'Нови стъкла (капаци) за фарове на над 120 модела коли: ляво, дясно или комплект. Наложен платеж, доставка с Еконт и Спиди. Помощ за избора във Viber.';
    document.title = title;
    meta('name', 'description', desc);
    meta('property', 'og:title', title);
    meta('property', 'og:description', desc);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();
</script>
