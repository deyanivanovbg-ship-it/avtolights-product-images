  function run() {
    var path = location.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
    var id = PAGES[path];
    if (!id || document.getElementById(id + '-live')) return;
    var box = document.createElement('div');
    box.id = id + '-live';
    box.appendChild(document.getElementById(id).content.cloneNode(true));
    var host = document.querySelector('.content-wrapper .content') || document.querySelector('#website') || document.body;
    host.insertBefore(box, host.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);

})();
